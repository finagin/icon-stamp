<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabler на фото</title>
<style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10131a; color: #f2f4fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: auto; padding: clamp(20px, 5vw, 64px); }
    h1 { margin: 0 0 22px; font-size: clamp(30px, 5vw, 44px); letter-spacing: -.045em; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 300px); gap: 16px; align-items: start; }
    .panel { background: #191e29; border: 1px solid #303849; border-radius: 18px; padding: 18px; }
    #drop { display: grid; place-items: center; width: 100%; min-height: 340px; padding: 12px; border: 1px dashed #596784; border-radius: 12px; background: #131722; color: #dce5ff; cursor: pointer; }
    #drop.drag { border-color: #a8bdff; background: #202d49; }
    canvas { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; object-fit: contain; background: conic-gradient(#353c4b 25%, #232936 0 50%, #353c4b 0 75%, #232936 0) 0 0 / 20px 20px; }
    .color-row { display: flex; align-items: center; gap: 8px; }
    .pick { flex: none; border: 1px solid #48536b; border-radius: 8px; padding: 5px 8px; background: #121722; color: inherit; cursor: pointer; }
    .pick[aria-pressed=true] { border-color: #a8bdff; background: #202d49; }
    .pick:disabled { opacity: .45; cursor: default; }
    #drop.picking, #drop.picking canvas { cursor: crosshair; }
    [hidden] { display: none !important; }
    label { display: block; margin: 14px 0 5px; }
    label:first-child { margin-top: 0; }
    output { float: right; color: #b8c9ff; }
    button, input, select { font: inherit; }
    input[type=text], select { width: 100%; border: 1px solid #48536b; border-radius: 8px; background: #121722; padding: 8px 10px; color: inherit; }
    input[type=color] { width: 100%; height: 36px; border: 1px solid #48536b; border-radius: 8px; background: #121722; cursor: pointer; }
    input[type=range] { width: 100%; accent-color: #a8bdff; }
    a { color: #b8c9ff; }
    small { display: block; margin-top: 6px; }
    #download { margin-top: 14px; width: 100%; border: 0; border-radius: 9px; padding: 10px; font-weight: 700; color: #111827; background: #b8c9ff; cursor: pointer; }
    #download:disabled { opacity: .45; cursor: default; }
    .status { margin: 10px 0 0; font-size: .88rem; color: #c3ccdf; }
    .status:empty { display: none; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } #drop { min-height: 240px; } }
</style>
<main>
    <h1>Tabler на фото</h1>
    <div class="layout">
        <section class="panel" aria-label="Изображение">
            <input type="file" id="file" accept="image/*" hidden>
            <button id="drop" type="button" aria-label="Выбрать изображение">
                <span id="prompt">Нажмите или перетащите изображение сюда</span>
                <canvas id="preview" aria-label="Предпросмотр" hidden></canvas>
            </button>
            <p class="status" id="image-status" role="status"></p>
        </section>
        <section class="panel" aria-label="Настройки иконки">
            <label for="icon">Название иконки</label>
            <input type="text" id="icon" value="heart" placeholder="Например, heart" spellcheck="false" autocomplete="off">
            <small><a href="https://tabler.io/icons" target="_blank" rel="noopener">Каталог Tabler Icons</a></small>
            <label for="style">Стиль</label>
            <select id="style"><option value="outline">Контур</option><option value="filled">Заливка</option></select>
            <label for="color">Цвет</label>
            <div class="color-row">
                <input type="color" id="color" value="#ffffff">
                <button type="button" class="pick" data-color="color" aria-label="Взять цвет иконки с изображения" aria-pressed="false" disabled>Пипетка</button>
            </div>
            <label for="opacity">Непрозрачность <output id="opacity-value" for="opacity">100%</output></label>
            <input type="range" id="opacity" min="0" max="100" value="100">
            <label for="size">Размер <output id="size-value" for="size">80%</output></label>
            <input type="range" id="size" min="1" max="100" value="80">
            <label for="back-color">Цвет подложки</label>
            <div class="color-row">
                <input type="color" id="back-color" value="#000000">
                <button type="button" class="pick" data-color="back-color" aria-label="Взять цвет подложки с изображения" aria-pressed="false" disabled>Пипетка</button>
            </div>
            <label for="back-opacity">Непрозрачность подложки <output id="back-opacity-value" for="back-opacity">0%</output></label>
            <input type="range" id="back-opacity" min="0" max="100" value="0">
            <p class="status" id="pick-status" role="status"></p>
            <p class="status" id="icon-status" role="status"></p>
            <button id="download" type="button" disabled>Скачать PNG</button>
            <p class="status" id="export-status" role="status"></p>
        </section>
    </div>
</main>
<script>
    const byId = id => document.getElementById(id);
    const file = byId('file');
    const drop = byId('drop');
    const preview = byId('preview');
    const icon = byId('icon');
    const style = byId('style');
    const color = byId('color');
    const size = byId('size');
    const opacity = byId('opacity');
    const backColor = byId('back-color');
    const backOpacity = byId('back-opacity');
    const pickButtons = document.querySelectorAll('.pick');
    let pickTarget;
    const download = byId('download');
    const iconStatus = byId('icon-status');
    const imageStatus = byId('image-status');
    const exportStatus = byId('export-status');
    const svgBase = 'https://unpkg.com/@tabler/icons@latest/icons';

    let photo, svg, overlay, photoName, iconRequest, iconTimer;
    let photoVersion = 0, overlayVersion = 0;
    let exporting = false;

    async function decode(blob) {
        const url = URL.createObjectURL(blob);
        try {
            const image = new Image();
            image.src = url;
            await image.decode();
            return image;
        } finally {
            URL.revokeObjectURL(url);
        }
    }

    function draw(canvas, width, height, image, badge, sizePercent, opacityPercent, backing) {
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('Canvas unavailable');
        context.drawImage(image, 0, 0, width, height);
        if (backing.opacity > 0) {
            context.globalAlpha = backing.opacity / 100;
            context.fillStyle = backing.color;
            context.fillRect(0, 0, width, height);
            context.globalAlpha = 1;
        }
        if (badge) {
            const side = Math.min(width, height) * sizePercent / 100;
            context.globalAlpha = opacityPercent / 100;
            context.drawImage(badge, (width - side) / 2, (height - side) / 2, side, side);
            context.globalAlpha = 1;
        }
    }

    function backingSettings() {
        return { color: backColor.value, opacity: Number(backOpacity.value) };
    }

    function setPickTarget(target) {
        pickTarget = target;
        drop.classList.toggle('picking', Boolean(target));
        drop.setAttribute('aria-label', target ? 'Взять цвет с изображения' : 'Выбрать изображение');
        for (const button of pickButtons) {
            button.setAttribute('aria-pressed', String(button.dataset.color === target));
        }
        byId('pick-status').textContent = target ? 'Нажмите на изображение, чтобы взять цвет. Esc — отмена.' : '';
    }

    function render() {
        for (const button of pickButtons) button.disabled = !photo;
        download.disabled = !photo || !overlay || exporting;
        if (!photo) return;
        const scale = Math.min(1, 1400 / Math.max(photo.naturalWidth, photo.naturalHeight));
        draw(preview, Math.max(1, Math.round(photo.naturalWidth * scale)),
            Math.max(1, Math.round(photo.naturalHeight * scale)),
            photo, overlay, Number(size.value), Number(opacity.value), backingSettings());
        byId('prompt').hidden = true;
        preview.hidden = false;
    }

    async function openPhoto(selected) {
        if (!selected) return;
        setPickTarget(null);
        const version = ++photoVersion;
        photo = null;
        preview.hidden = true;
        byId('prompt').hidden = false;
        imageStatus.textContent = 'Открываем изображение…';
        exportStatus.textContent = '';
        render();
        try {
            const decoded = await decode(selected);
            if (version !== photoVersion) return;
            photo = decoded;
            photoName = selected.name.replace(/\.[^.]+$/, '') || 'image';
            imageStatus.textContent = `${photo.naturalWidth} × ${photo.naturalHeight} пикселей`;
            render();
        } catch {
            if (version !== photoVersion) return;
            photo = null;
            imageStatus.textContent = 'Не удалось открыть изображение. Попробуйте PNG, JPEG или WebP.';
            render();
        }
    }

    function rasterize(markup, tint, side) {
        const documentNode = new DOMParser().parseFromString(markup, 'image/svg+xml');
        const root = documentNode.documentElement;
        if (root.localName !== 'svg') throw new Error('Invalid SVG');
        root.setAttribute('color', tint);
        root.setAttribute('width', String(side));
        root.setAttribute('height', String(side));
        const source = new XMLSerializer().serializeToString(root);
        return decode(new Blob([source], { type: 'image/svg+xml' }));
    }

    async function updateOverlay() {
        const version = ++overlayVersion;
        overlay = null;
        render();
        if (!svg) return;
        try {
            const decoded = await rasterize(svg, color.value, 512);
            if (version !== overlayVersion) return;
            overlay = decoded;
            iconStatus.textContent = '';
            render();
        } catch {
            if (version !== overlayVersion) return;
            iconStatus.textContent = 'Не удалось отрисовать иконку.';
        }
    }

    function queueIcon(delay) {
        clearTimeout(iconTimer);
        iconRequest?.abort();
        ++overlayVersion;
        svg = overlay = null;
        render();
        const name = icon.value.trim().toLowerCase().replace(/^ti-/, '');
        if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)) {
            iconStatus.textContent = 'Введите имя из каталога, например arrow-left.';
            return;
        }
        iconStatus.textContent = 'Загружаем иконку…';
        const request = new AbortController();
        iconRequest = request;
        iconTimer = setTimeout(async () => {
            try {
                const response = await fetch(`${svgBase}/${style.value}/${name}.svg`, { signal: request.signal });
                if (response.status === 404) {
                    if (!request.signal.aborted) iconStatus.textContent = 'Иконка не найдена в этом стиле.';
                    return;
                }
                if (!response.ok) throw new Error('Icon unavailable');
                const markup = await response.text();
                if (request.signal.aborted) return;
                svg = markup;
                await updateOverlay();
            } catch {
                if (!request.signal.aborted) iconStatus.textContent = 'Не удалось загрузить иконку. Проверьте интернет и попробуйте снова.';
            }
        }, delay);
    }

    for (const button of pickButtons) {
        button.addEventListener('click', () => {
            setPickTarget(pickTarget === button.dataset.color ? null : button.dataset.color);
        });
    }
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && pickTarget) setPickTarget(null);
    });
    drop.addEventListener('click', event => {
        if (!pickTarget) {
            file.click();
            return;
        }
        const bounds = preview.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width;
        const y = (event.clientY - bounds.top) / bounds.height;
        if (!photo || x < 0 || x >= 1 || y < 0 || y >= 1) return;
        const sample = document.createElement('canvas');
        sample.width = sample.height = 1;
        const context = sample.getContext('2d');
        const column = Math.floor(x * photo.naturalWidth);
        const row = Math.floor(y * photo.naturalHeight);
        context.drawImage(photo, column, row, 1, 1, 0, 0, 1, 1);
        const pixel = context.getImageData(0, 0, 1, 1).data;
        if (pixel[3] === 0) {
            byId('pick-status').textContent = 'Этот пиксель прозрачный. Выберите другую точку.';
            return;
        }
        const input = byId(pickTarget);
        input.value = '#' + Array.from(pixel.slice(0, 3), channel => channel.toString(16).padStart(2, '0')).join('');
        setPickTarget(null);
        input.dispatchEvent(new Event('input'));
    });
    file.addEventListener('change', async () => {
        const selected = file.files[0];
        file.value = '';
        await openPhoto(selected);
    });
    for (const eventName of ['dragover', 'drop']) {
        window.addEventListener(eventName, event => {
            if (event.dataTransfer.types.includes('Files')) event.preventDefault();
        });
    }
    for (const eventName of ['dragenter', 'dragover']) {
        drop.addEventListener(eventName, event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
            drop.classList.add('drag');
        });
    }
    drop.addEventListener('dragleave', event => {
        if (!drop.contains(event.relatedTarget)) drop.classList.remove('drag');
    });
    drop.addEventListener('drop', async event => {
        event.preventDefault();
        drop.classList.remove('drag');
        await openPhoto(event.dataTransfer.files[0]);
    });
    icon.addEventListener('input', () => queueIcon(250));
    icon.addEventListener('keydown', event => {
        if (event.key === 'Enter') queueIcon(0);
    });
    style.addEventListener('change', () => queueIcon(0));
    color.addEventListener('input', updateOverlay);
    size.addEventListener('input', () => {
        byId('size-value').value = size.value + '%';
        render();
    });
    opacity.addEventListener('input', () => {
        byId('opacity-value').value = opacity.value + '%';
        render();
    });

    backColor.addEventListener('input', render);
    backOpacity.addEventListener('input', () => {
        byId('back-opacity-value').value = backOpacity.value + '%';
        render();
    });

    download.addEventListener('click', async () => {
        if (!photo || !overlay || exporting) return;
        exporting = true;
        download.disabled = true;
        exportStatus.textContent = 'Готовим PNG…';
        const filename = photoName + '-tabler.png';
        const image = photo;
        const sizePercent = Number(size.value);
        const opacityPercent = Number(opacity.value);
        const backing = backingSettings();
        const width = image.naturalWidth;
        const height = image.naturalHeight;
        try {
            const side = Math.max(1, Math.ceil(Math.min(width, height) * sizePercent / 100));
            const badge = await rasterize(svg, color.value, side);
            const canvas = document.createElement('canvas');
            draw(canvas, width, height, image, badge, sizePercent, opacityPercent, backing);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) throw new Error('PNG encoding failed');
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            exportStatus.textContent = '';
        } catch {
            exportStatus.textContent = 'Не удалось сохранить PNG. Попробуйте ещё раз или выберите изображение меньшего размера.';
        } finally {
            exporting = false;
            download.disabled = !photo || !overlay;
        }
    });

    queueIcon(0);
</script>
</html>
